<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Import SortableJS for drag-and-drop -->
    <script src="sortable.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>Color Palette Generator</h1>
        <div class="controls">
            <label for="colorCount">Number of Colors:</label>
            <input id="colorCount" type="number" min="2" max="20" value="5">

            <label for="algorithm">Algorithm:</label>
            <select id="algorithm">
                <option value="analogous" selected>Analogous</option>
                <option value="random">Random</option>
                <option value="complementary">Complementary</option>
                <option value="triadic">Triadic</option>
                <option value="tetradic">Tetradic</option>
            </select>
            <button id="generateBtn">Generate Palette</button>
            <button id="unlockAllBtn">Unlock All</button>
            <button id="undoBtn">Undo</button>
            <button id="redoBtn">Redo</button>
            <button id="applySlidersBtn">Apply Adjustments</button>
            <button id="resetSlidersBtn">Reset Sliders</button>
            <button id="saveSwatchesBtn">Save Swatches Image</button>
            <button id="savePaletteBtn">Save to Favorites</button>
            <button id="viewFavoritesBtn">View Favorites</button>
        </div>
        <div class="adjustments">
            <div class="slider-group">
                <label for="hueOffset">Hue Offset:</label>
                <input type="range" id="hueOffset" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <label for="satOffset">Saturation Offset:</label>
                <input type="range" id="satOffset" min="-100" max="100" value="0">
            </div>
            <div class="slider-group">
                <label for="lightOffset">Lightness Offset:</label>
                <input type="range" id="lightOffset" min="-100" max="100" value="0">
            </div>
            <!-- New Checkbox for Toggling Hex Codes Visibility -->
            <div class="slider-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="toggleHexCodes" checked>
                    Show Hex Codes
                </label>
            </div>
            <!-- Existing Checkbox for Toggling Locked Colors Visibility -->
            <div class="slider-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="toggleLockedVisibility" checked>
                    Show Locked Colors
                </label>
            </div>
        </div>
    </header>
    <div class="palette" id="palette"></div>

    <div class="dialog" id="nameDialog">
        <div class="dialog-box">
            <h3>Name This Palette</h3>
            <input id="paletteNameField" type="text" placeholder="Palette Name">
            <div class="dialog-actions">
                <button id="cancelNameDialog">Cancel</button>
                <button id="nameDialogOk">OK</button>
            </div>
        </div>
    </div>

    <div class="dialog" id="favoritesDialog">
        <div class="dialog-box">
            <h3>Your Favorite Palettes</h3>
            <div id="favoritesList"></div>
            <div class="dialog-actions">
                <button id="closeFavoritesBtn">Close</button>
            </div>
        </div>
    </div>

    <div class="snackbar" id="toast"></div>

    <!-- Include the modular JavaScript files -->
    <script src="utils.js"></script>
    <script src="palette.js"></script>
    <script src="adjustments.js"></script>
    <script src="undoRedo.js"></script>
    <script src="favorites.js"></script>
    <script src="main.js"></script>
</body>
</html>
