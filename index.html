<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Material Design 3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@material/web@latest/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@material/web@latest/all.min.js"></script>
    <!-- Import SortableJS for drag-and-drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>Color Palette Generator</h1>
        <div class="controls">
            <md-outlined-text-field type="number" id="colorCount" min="2" max="20" value="5" label="Number of Colors"></md-outlined-text-field>

            <md-outlined-select id="algorithm" label="Algorithm">
                <md-option value="analogous" selected>Analogous</md-option>
                <md-option value="random">Random</md-option>
                <md-option value="complementary">Complementary</md-option>
                <md-option value="triadic">Triadic</md-option>
                <md-option value="tetradic">Tetradic</md-option>
            </md-outlined-select>

            <md-filled-button id="generateBtn">Generate Palette</md-filled-button>
            <md-filled-button id="unlockAllBtn">Unlock All</md-filled-button>
            <md-filled-button id="undoBtn">Undo</md-filled-button>
            <md-filled-button id="redoBtn">Redo</md-filled-button>
            <md-filled-button id="applySlidersBtn">Apply Adjustments</md-filled-button>
            <md-filled-button id="resetSlidersBtn">Reset Sliders</md-filled-button>
            <md-filled-button id="saveSwatchesBtn">Save Swatches Image</md-filled-button>
            <!-- Existing Buttons -->
            <md-filled-button id="savePaletteBtn">Save to Favorites</md-filled-button>
            <md-filled-button id="viewFavoritesBtn">View Favorites</md-filled-button>
        </div>
        <div class="adjustments">
            <div class="slider-group">
                <label for="hueOffset">Hue Offset:</label>
                <md-slider labeled id="hueOffset" min="-180" max="180" value="0"></md-slider>
            </div>
            <div class="slider-group">
                <label for="satOffset">Saturation Offset:</label>
                <md-slider labeled id="satOffset" min="-100" max="100" value="0"></md-slider>
            </div>
            <div class="slider-group">
                <label for="lightOffset">Lightness Offset:</label>
                <md-slider labeled id="lightOffset" min="-100" max="100" value="0"></md-slider>
            </div>
            <!-- New Checkbox for Toggling Hex Codes Visibility -->
            <div class="slider-group">
                <label for="toggleHexCodes">
                    <md-checkbox id="toggleHexCodes" checked></md-checkbox>
                    Show Hex Codes
                </label>
            </div>
            <!-- Existing Checkbox for Toggling Locked Colors Visibility -->
            <div class="slider-group">
                <label for="toggleLockedVisibility">
                    <md-checkbox id="toggleLockedVisibility" checked></md-checkbox>
                    Show Locked Colors
                </label>
            </div>
        </div>
    </header>
    <div class="palette" id="palette"></div>

    <!-- Modal for Favorites -->
    <md-dialog id="favoritesModal">
        <div slot="headline">Your Favorite Palettes</div>
        <div slot="content">
            <div id="favoritesList"></div>
        </div>
        <div slot="actions">
            <md-text-button dialog-action="close">Close</md-text-button>
        </div>
    </md-dialog>

    <!-- Include the modular JavaScript files -->
    <script src="utils.js"></script>
    <script src="palette.js"></script>
    <script src="adjustments.js"></script>
    <script src="undoRedo.js"></script>
    <script src="favorites.js"></script>
    <script src="main.js"></script>
</body>
</html>
