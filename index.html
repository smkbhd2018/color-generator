<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Import SortableJS for drag-and-drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="./node_modules/@fontsource/roboto/index.css">
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "/node_modules/@material/web/"
        }
      }
    </script>
    <script type="module">
      import "@material/web/all.js";
      import {styles as typescaleStyles} from "@material/web/typography/md-typescale-styles.js";
      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
</head>
<body>
    <header class="header">
        <h1>Color Palette Generator</h1>
        <div class="controls">
            <md-outlined-text-field id="colorCount" label="Number of Colors" type="number" min="2" max="20" value="5"></md-outlined-text-field>

            <md-outlined-select id="algorithm" label="Algorithm">
                <md-select-option value="analogous" selected><div slot="headline">Analogous</div></md-select-option>
                <md-select-option value="random"><div slot="headline">Random</div></md-select-option>
                <md-select-option value="complementary"><div slot="headline">Complementary</div></md-select-option>
                <md-select-option value="triadic"><div slot="headline">Triadic</div></md-select-option>
                <md-select-option value="tetradic"><div slot="headline">Tetradic</div></md-select-option>
            </md-outlined-select>
            <md-filled-button id="generateBtn">Generate Palette</md-filled-button>
            <md-filled-button id="unlockAllBtn">Unlock All</md-filled-button>
            <md-filled-button id="undoBtn">Undo</md-filled-button>
            <md-filled-button id="redoBtn">Redo</md-filled-button>
            <md-filled-button id="applySlidersBtn">Apply Adjustments</md-filled-button>
            <md-filled-button id="resetSlidersBtn">Reset Sliders</md-filled-button>
            <md-filled-button id="saveSwatchesBtn">Save Swatches Image</md-filled-button>
            <md-filled-button id="savePaletteBtn">Save to Favorites</md-filled-button>
            <md-filled-button id="viewFavoritesBtn">View Favorites</md-filled-button>
        <div class="adjustments">
            <div class="slider-group">
                <label for="hueOffset">Hue Offset:</label>
                <md-slider id="hueOffset" min="-180" max="180" value="0"></md-slider>
            </div>
            <div class="slider-group">
                <label for="satOffset">Saturation Offset:</label>
                <md-slider id="satOffset" min="-100" max="100" value="0"></md-slider>
            </div>
            <div class="slider-group">
                <label for="lightOffset">Lightness Offset:</label>
                <md-slider id="lightOffset" min="-100" max="100" value="0"></md-slider>
            </div>
            <!-- New Checkbox for Toggling Hex Codes Visibility -->
            <div class="slider-group">
                <md-checkbox id="toggleHexCodes" checked></md-checkbox>
                <span>Show Hex Codes</span>
            </div>
            <!-- Existing Checkbox for Toggling Locked Colors Visibility -->
            <div class="slider-group">
                <md-checkbox id="toggleLockedVisibility" checked></md-checkbox>
                <span>Show Locked Colors</span>
            </div>
        </div>
    </header>
    <div class="palette" id="palette"></div>

    <md-dialog id="nameDialog">
        <div slot="headline">Name This Palette</div>
        <div slot="content">
            <md-outlined-text-field id="paletteNameField" label="Palette Name"></md-outlined-text-field>
        </div>
        <div slot="actions">
            <md-text-button dialog-action="cancel">Cancel</md-text-button>
            <md-text-button id="nameDialogOk">OK</md-text-button>
        </div>
    </md-dialog>

    <md-dialog id="favoritesDialog">
        <div slot="headline">Your Favorite Palettes</div>
        <div slot="content">
            <div id="favoritesList"></div>
        </div>
        <div slot="actions">
            <md-text-button id="closeFavoritesBtn">Close</md-text-button>
        </div>
    </md-dialog>

    <md-snackbar id="toast"></md-snackbar>

    <!-- Include the modular JavaScript files -->
    <script src="utils.js"></script>
    <script src="palette.js"></script>
    <script src="adjustments.js"></script>
    <script src="undoRedo.js"></script>
    <script src="favorites.js"></script>
    <script src="main.js"></script>
</body>
</html>
